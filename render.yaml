services:
  - type: web
    name: chess-realm-api
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: chess-realm-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: STOCKFISH_PATH
        sync: false

databases:
  - name: chess-realm-db
    databaseName: chess_realm
    user: chess_realm_user
    plan: basic-256mb
